name: Yayın adayı
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun ci
      - id: metadata
        run: bun -e 'import {version} from "./package.json"; import {önSürümMü} from "./scripts/yayın.ts"; console.log("version=" + version); console.log("prerelease=" + önSürümMü())' >> "$GITHUB_OUTPUT"
      - name: Tag sürümünü doğrula
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run scripts/yayın.ts "$RELEASE_TAG"
      - run: bun run check
      - name: Bun runtime önbelleğini hazırla
        run: bun run release:runtime
      - run: bun run release:prepare
      - run: bun run scripts/binary-smoke.ts --release
      - name: Ağ kullanmadan Linux install ve uninstall smoke
        run: bun run test:installer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ata-${{ steps.metadata.outputs.version }}-release-candidate
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ata-${{ needs.build.outputs.version }}-release-candidate
          path: dist/release
      - name: İndirilen assetleri ve tag eşleşmesini tekrar doğrula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun run scripts/yayın.ts "$RELEASE_TAG"
          bun run release:verify
      - name: Mevcut tag için sürüme uygun release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          case "$PRERELEASE" in
            true) flags=(--prerelease --latest=false) ;;
            false) flags=(--latest) ;;
            *) echo 'Geçersiz prerelease bilgisi.' >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag "${flags[@]}" --title "Ata Dil $VERSION" --notes-file "docs/sürümler/$VERSION.md"
